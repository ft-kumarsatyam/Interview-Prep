# Local stack: `docker compose up -d mongo redis redis-rest` for dev with `npm run dev`,
# or `docker compose up --build` to run the app container too.
#
# Mongo runs as a single-node replica set because transactions (the outbox) and change streams need one.
services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Speaks the Upstash REST protocol in front of Redis, so UpstashKv works unchanged against local Redis.
  redis-rest:
    image: hiett/serverless-redis-http:latest
    depends_on: [redis]
    ports: ["8079:80"]
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379

  app:
    build: .
    profiles: ["app"]
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/prepos?replicaSet=rs0
      UPSTASH_REDIS_REST_URL: http://redis-rest:80
      UPSTASH_REDIS_REST_TOKEN: local-dev-token
    env_file:
      - path: .env.local
        required: false

volumes:
  mongo-data:
