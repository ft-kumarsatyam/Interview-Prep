# The evening nudge: "what is still open today, and how long is left". Vercel Hobby only has two
# cron slots (morning plan and night recap), so this free GitHub schedule calls the third endpoint.
# It needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL      your production URL, e.g. https://prep.example.com
#   CRON_SECRET  the same value as the CRON_SECRET env var on Vercel
# Without them it does nothing. The endpoint only sends when today is unfinished, and only once a day,
# so a late or repeated run is harmless. GitHub may start scheduled runs up to ~30 minutes late.
name: Evening nudge

on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC = 20:30 IST
  workflow_dispatch:

permissions: {}

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set as a repository secret; skipping the evening nudge."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/reminder"
