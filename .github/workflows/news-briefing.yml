# Dynamic news: every few hours, refresh the feeds, send the daily briefing the first time after 08:00 local,
# and push a standout fresh story if there is one (at most 3 a day). Vercel Hobby only has two cron slots, so
# this free GitHub schedule calls the briefing endpoint. Needs the repository secrets APP_URL and CRON_SECRET
# (same as the evening nudge). Every send is idempotent, so a late or repeated run is harmless.
name: News briefing

on:
  schedule:
    - cron: "15 3,6,9,12,15 * * *" # 08:45, 11:45, 14:45, 17:45, 20:45 IST
  workflow_dispatch:

permissions: {}

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the briefing endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set as a repository secret; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/briefing"
