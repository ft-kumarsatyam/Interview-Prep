# Job discovery: every 3 hours, read the public job boards of the companies in data/careers.json (plus the
# remote-job feeds) and keep the Discover list fresh. One run handles the sources that are due within its
# time budget and the rest wait for the next run, so the schedule just keeps rotating. Same repository
# secrets as the other jobs: APP_URL and CRON_SECRET. Without them it does nothing. Safe to run any time.
name: Job sync

on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the job sync endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set as a repository secret; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 70 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/jobs"
