# CI on every push/PR. A push to main that passes CI deploys to Vercel
# production (needs the VERCEL_TOKEN repo secret, see README §4).
# Manual run (Actions tab → Deploy → Run workflow): seeds MongoDB, then, if a
# production URL is given, smoke-tests the login page and both cron endpoints.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Production URL for smoke tests, e.g. https://prepos.vercel.app (blank = seed only)"
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Production build
        run: npm run build

  deploy-production:
    name: Deploy to Vercel production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_6u99HI2ssB7v6jvFpicGLW9H
      VERCEL_PROJECT_ID: prj_yQPtgILGVradyaJweYjGtrxCkGup
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Check VERCEL_TOKEN
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add a VERCEL_TOKEN repository secret (vercel.com/account/tokens)."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  seed-production:
    name: Seed MongoDB (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Upsert problems, topics, settings
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD_HASH_B64: ${{ secrets.ADMIN_PASSWORD_HASH_B64 }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          APP_TIMEZONE: ${{ secrets.APP_TIMEZONE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npm run seed

  smoke-production:
    name: Smoke-test production (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.production_url != ''
    needs: seed-production
    runs-on: ubuntu-latest
    steps:
      - name: Login page, auth gate and cron endpoints
        env:
          BASE: ${{ inputs.production_url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE="${BASE%/}"
          expect() { # expect <status> <description> <curl args...>
            want=$1; shift; what=$1; shift
            got=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 90 "$@")
            if [[ "$got" != "$want" ]]; then echo "✗ $what: expected $want, got $got"; cat /tmp/body; exit 1; fi
            echo "✓ $what ($got)"
          }
          expect 200 "login page" "$BASE/login"
          expect 307 "dashboard redirects when signed out" "$BASE/dashboard"
          expect 401 "morning cron rejects missing token" "$BASE/api/cron/morning"
          expect 401 "evening cron rejects wrong token" -H "Authorization: Bearer wrong" "$BASE/api/cron/evening"
          expect 200 "morning cron with CRON_SECRET" -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/morning"
          cat /tmp/body; echo
          expect 200 "evening cron with CRON_SECRET" -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/evening"
          cat /tmp/body; echo
