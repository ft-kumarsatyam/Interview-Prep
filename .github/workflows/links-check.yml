# Keeps roadmap links honest: once a day, check the next batch of roadmap learning links and flag the dead ones.
# Vercel Hobby only has two cron slots, so this free GitHub schedule calls the endpoint. Needs the repository
# secrets APP_URL and CRON_SECRET (same as the news briefing). Each run checks only the stalest links, so a late
# or repeated run is harmless.
name: Roadmap link check

on:
  schedule:
    - cron: "40 21 * * *" # 03:10 IST
  workflow_dispatch:

permissions: {}

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the link-check endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set as a repository secret; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/links"
